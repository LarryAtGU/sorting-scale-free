[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scn-sorting-experiments"
version = "1.3.0"
description = "Experiments on comparison-sort efficiency and sorting comparison networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scn-generate-inputs = "scn_sorting.experiments.generate_inputs:main"
scn-test-randomness = "scn_sorting.experiments.validate_randomness:main"
scn-run-batch = "scn_sorting.experiments.batch:main"

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.9",
  "numpy>=2.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "matplotlib>=3.9",
  "numpy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scn_sorting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
